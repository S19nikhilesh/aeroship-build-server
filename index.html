<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeroship Live Logs Dashboard</title>
    <style>
        body { 
            background: #0f172a; 
            color: #38bdf8; 
            font-family: monospace; 
            padding: 20px; 
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        #logs-box { 
            background: #020617; 
            border: 1px solid #1e293b; 
            padding: 15px; 
            height: 450px; 
            overflow-y: scroll; 
            border-radius: 8px; 
            white-space: pre-wrap; 
            font-size: 14px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        input { 
            flex: 1;
            padding: 10px; 
            background: #1e293b; 
            color: #fff; 
            border: 1px solid #475569; 
            border-radius: 4px; 
            font-family: monospace; 
        }
        button { 
            padding: 10px 20px; 
            background: #2563eb; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-family: monospace; 
            font-weight: bold;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Aeroship Live Build Logs</h2>
        <div class="controls">
            <input type="text" id="projectSlug" placeholder="Enter Project Slug (e.g. happy-tiger-12)">
            <button onclick="connectSocket()">Watch Live Logs</button>
        </div>

        <div id="logs-box">Awaiting project slug connection...</div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket;

        function connectSocket() {
            const slug = document.getElementById('projectSlug').value.trim();
            const box = document.getElementById('logs-box');

            if (!slug) {
                alert('Please enter a valid project slug!');
                return;
            }

            if (socket) {
                socket.disconnect();
            }

            box.innerHTML = `Connecting to Socket Server...\n`;

            // तेरा Socket.io सर्वर पोर्ट 9001 पर चल रहा है
            socket = io('http://localhost:9001');

            socket.on('connect', () => {
                box.innerHTML += `Connected! Subscribing to room: logs:${slug}\n\n`;
                // सर्वर पर 'subscribe' इवेंट भेज रहे हैं जो ठीक तेरे टर्मिनल वाले psubscribe जैसा काम करेगा
                socket.emit('subscribe', `logs:${slug}`);
            });

            socket.on('message', (data) => {
                // डेटा को सुंदर तरीके से प्रिंट करना
                try {
                    const parsed = JSON.parse(data);
                    box.innerHTML += `${parsed.log || data}\n`;
                } catch (e) {
                    box.innerHTML += `${data}\n`;
                }
                // ऑटो स्क्रॉल नीचे की तरफ
                box.scrollTop = box.scrollHeight;
            });

            socket.on('disconnect', () => {
                box.innerHTML += `\n❌ Disconnected from server.\n`;
            });
        }
    </script>
</body>
</html>
